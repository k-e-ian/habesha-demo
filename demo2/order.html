<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Mesob | Habesha Ethiopian Restaurant</title><meta name="robots" content="noindex">
<link rel="icon" href="../img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Marcellus&family=Noto+Serif+Ethiopic:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ceremony.css?v=1">
<style>
  main { max-width: 640px; margin: 0 auto; padding: 16px 24px 96px; }
  .ln { display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: center; padding: 16px 0; box-shadow: inset 0 -1px 0 var(--injera-200); }
  .ln b { font-family: var(--display); font-weight: 400; font-size: 1.25rem; }
  .q button { width: 32px; height: 32px; border: 0; border-radius: var(--r); background: var(--injera-100); box-shadow: inset 0 0 0 1px var(--injera-200); cursor: pointer; }
  .ways { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 32px 0 24px; }
  .ways button { padding: 16px; border: 0; border-radius: var(--r); background: #fff; box-shadow: inset 0 0 0 1px var(--injera-200); cursor: pointer; font-family: var(--display); font-size: 1.125rem; }
  .ways button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--green-700); color: var(--green-700); }
  .total { text-align: right; font-family: var(--display); font-size: 1.875rem; margin: 16px 0 0; }
</style>
</head>
<body>
<div class="concept">Concept preview (demo 2) by WolfXTech. Payments are simulated until M-Pesa is connected.</div>
<div class="tricolour" aria-hidden="true"></div>
<div class="wrap"><nav class="top"><a class="logo" href="index.html"><span class="eth" lang="am">ሐበሻ</span><b>HABESHA</b></a></nav></div>
<main>
  <h1 style="font-size:2.25rem">Your mesob</h1>
  <p class="muted" style="margin:8px 0 0">Everything you've chosen, ready to share.</p>
  <div id="lines"></div>
  <form id="f" novalidate>
    <div class="ways" role="group" aria-label="Pickup or delivery"><button type="button" data-way="pickup" aria-pressed="true">Pick up</button><button type="button" data-way="delivery" aria-pressed="false">Deliver</button></div>
    <label class="field"><span>Name</span><input name="name" autocomplete="name"></label>
    <label class="field"><span>M-Pesa number</span><input name="phone" inputmode="tel" autocomplete="tel" placeholder="0712 345 678"></label>
    <label class="field" id="addr" hidden><span>Delivery address</span><textarea name="address" rows="2"></textarea></label>
    <label class="field"><span>Injera and notes</span><input name="notes" placeholder="Brown injera please, extra spicy"></label>
    <p class="err" id="err" hidden></p>
    <button class="btn btn-berbere" id="pay" type="submit" style="width:100%" disabled>Pay with M-Pesa</button>
  </form>
</main>
<script src="../kit.js"></script>
<script>
  const b = Kit.basket('habesha-mesob'); let data, way = 'pickup';
  function render() {
    const t = Kit.totals(b, data.items, way, data.delivery_fee);
    document.getElementById('lines').innerHTML = t.lines.length ? t.lines.map(l => `<div class="ln"><b>${Kit.esc(l.name)}</b><span class="q"><button type="button" data-q="${Kit.esc(l.id)}" data-d="-1" aria-label="One less">−</button> ${l.qty} <button type="button" data-q="${Kit.esc(l.id)}" data-d="1" aria-label="One more">+</button></span><span>${Kit.fmt(l.line)}</span></div>`).join('')
      + (t.delivery ? `<p class="muted" style="text-align:right;margin:16px 0 0">Delivery ${Kit.fmt(t.delivery)}</p>` : '') + `<p class="total">KES ${Kit.fmt(t.total)}</p>`
      : '<p>Your mesob is empty. <a href="index.html#abol">Begin the first round</a>.</p>';
    const btn = document.getElementById('pay'); btn.disabled = !t.lines.length; btn.textContent = t.lines.length ? `Pay KES ${Kit.fmt(t.total)} with M-Pesa` : 'Pay with M-Pesa';
  }
  document.addEventListener('click', e => {
    const q = e.target.closest('[data-q]'); if (q) { b.add(q.dataset.q, +q.dataset.d); render(); }
    const w = e.target.closest('[data-way]'); if (w) { way = w.dataset.way; document.querySelectorAll('[data-way]').forEach(x => x.setAttribute('aria-pressed', x === w)); document.getElementById('addr').hidden = way !== 'delivery'; render(); }
  });
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault(); const f = new FormData(e.target), err = document.getElementById('err'), btn = document.getElementById('pay');
    err.hidden = true; btn.disabled = true; btn.textContent = 'Sending the M-Pesa prompt…';
    try { const o = await Kit.placeOrder(b, { name: f.get('name'), phone: f.get('phone'), fulfilment: way, address: f.get('address'), notes: f.get('notes') }); location.href = 'track.html?id=' + encodeURIComponent(o.id); }
    catch (ex) { err.textContent = ex.message; err.hidden = false; render(); }
  });
  Kit.menu().then(d => { data = d; render(); });
</script>
</body>
</html>
